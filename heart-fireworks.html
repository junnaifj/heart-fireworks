<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Fireworks Show</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#05051a;overflow:hidden;cursor:crosshair;font-family:system-ui,sans-serif}canvas{display:block}#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}#ui button{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.22);padding:11px 22px;border-radius:25px;cursor:pointer;font-size:13px;font-weight:600;backdrop-filter:blur(10px);letter-spacing:.5px;transition:all .2s}#ui button:hover{background:rgba(255,255,255,0.25);transform:translateY(-1px)}#info{position:fixed;top:22px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:4px;text-transform:uppercase;z-index:10;font-weight:500}
</style></head><body><div id="info">Click anywhere to launch 🎆</div><div id="ui"><button onclick="autoShow()">🎇 Auto Show</button><button onclick="finale()">💥 Finale</button></div><canvas id="c"></canvas><script>
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var W,H,stars=[],moon={x:0,y:0};
function mkStars(){stars=[];for(var i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random()*0.75,r:Math.random()*1.2+0.3,o:Math.random()*6.28,tw:Math.random()*0.5+0.5});moon.x=W*0.82;moon.y=H*0.15}
function onResize(){W=cv.width=innerWidth;H=cv.height=innerHeight;mkStars()}onResize();addEventListener('resize',onResize);
var MAX_P=1200,MAX_R=24;
var px=new Float32Array(MAX_P),py=new Float32Array(MAX_P),pvx=new Float32Array(MAX_P),pvy=new Float32Array(MAX_P),pl=new Float32Array(MAX_P),pml=new Float32Array(MAX_P),ps=new Float32Array(MAX_P),pt=new Uint8Array(MAX_P);var pc=new Array(MAX_P);var pn=0;
var rx=new Float32Array(MAX_R),ry=new Float32Array(MAX_R),rvx=new Float32Array(MAX_R),rvy=new Float32Array(MAX_R),rtx=new Float32Array(MAX_R),rty=new Float32Array(MAX_R),rtype=new Uint8Array(MAX_R);var rc=new Array(MAX_R);var rn=0;
var PALETTES=[['#ff4757','#ff6b81','#ffa502','#ffdd59'],['#2ed573','#7bed9f','#70a1ff','#5352ed'],['#ff6348','#ffa502','#ffdd59','#ff6b81'],['#a55eea','#c56cf0','#ff6b81','#ffdd59'],['#00d2d3','#54a0ff','#5f27cd','#c56cf0'],['#ffffff','#fef3c7','#fde68a','#fbbf24']];
function rand(a,b){return Math.random()*(b-a)+a}function pickCol(p){return p[~~(Math.random()*p.length)]}
function addRocket(tx,ty){if(rn>=MAX_R)return;var sx=tx+rand(-40,40);var dx=tx-sx,dy=ty-H,d=Math.sqrt(dx*dx+dy*dy);var i=rn++;rx[i]=sx;ry[i]=H;rvx[i]=dx/d*7;rvy[i]=dy/d*7;rtx[i]=tx;rty[i]=ty;rtype[i]=~~(Math.random()*4);rc[i]=PALETTES[~~(Math.random()*PALETTES.length)]}
function spawn(bx,by,vx,vy,life,size,col,type){if(pn>=MAX_P)return;var i=pn++;px[i]=bx;py[i]=by;pvx[i]=vx;pvy[i]=vy;pl[i]=life;pml[i]=life;ps[i]=size;pc[i]=col;pt[i]=type}
/* The original effect is unchanged; only its explosion directions form a heart. */
function boom(bx,by,pal,type){var n=Math.min(110,MAX_P-pn),j,t,hx,hy,sp;for(j=0;j<n;j++){t=j/n*6.283+rand(-0.018,0.018);hx=16*Math.pow(Math.sin(t),3);hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));sp=rand(.205,.235);spawn(bx,by,hx*sp+rand(-.1,.1),hy*sp+rand(-.1,.1),rand(45,70),rand(1.8,3.2),pickCol(pal),0)}}
function drawSky(t){cx.fillStyle='rgba(5,5,26,0.18)';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='lighter';for(var i=0;i<stars.length;i++){var s=stars[i];var f=s.tw*(0.5+Math.sin(t*0.002+s.o)*0.4);cx.globalAlpha=f;cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.283);cx.fill()}cx.globalAlpha=1;var g=cx.createRadialGradient(moon.x,moon.y,0,moon.x,moon.y,60);g.addColorStop(0,'rgba(255,248,220,0.35)');g.addColorStop(0.4,'rgba(255,240,200,0.1)');g.addColorStop(1,'rgba(255,240,200,0)');cx.fillStyle=g;cx.fillRect(moon.x-70,moon.y-70,140,140);cx.fillStyle='rgba(255,248,220,0.9)';cx.beginPath();cx.arc(moon.x,moon.y,18,0,6.283);cx.fill();cx.globalCompositeOperation='source-over'}
function loop(ts){var t=ts||0;drawSky(t);cx.globalCompositeOperation='lighter';var j=0;for(var i=0;i<rn;i++){rx[i]+=rvx[i];ry[i]+=rvy[i];var dx=rtx[i]-rx[i],dy=rty[i]-ry[i];if(dx*dx+dy*dy<150){boom(rx[i],ry[i],rc[i],rtype[i])}else{spawn(rx[i]+rand(-1,1),ry[i]+rand(-1,1),rand(-0.3,0.3),rand(0.5,1.5),rand(8,15),rand(0.8,1.4),'#fff5c0',3);cx.fillStyle='#fff';cx.beginPath();cx.arc(rx[i],ry[i],2,0,6.283);cx.fill();cx.fillStyle=rc[i][0];cx.globalAlpha=0.5;cx.beginPath();cx.arc(rx[i],ry[i],4.5,0,6.283);cx.fill();cx.globalAlpha=1;if(j!==i){rx[j]=rx[i];ry[j]=ry[i];rvx[j]=rvx[i];rvy[j]=rvy[i];rtx[j]=rtx[i];rty[j]=rty[i];rc[j]=rc[i];rtype[j]=rtype[i]}j++}}rn=j;j=0;for(var i=0;i<pn;i++){var type=pt[i];px[i]+=pvx[i];py[i]+=pvy[i];if(type===1){pvy[i]+=0.035;pvx[i]*=0.99}else if(type===3){pvy[i]+=0.02}else{pvy[i]+=0.055;pvx[i]*=0.982;pvy[i]*=0.99}pl[i]--;if(pl[i]>0){var alpha=pl[i]/pml[i];var sz=ps[i]*alpha;if(type===2&&Math.random()<0.3)sz*=2;cx.globalAlpha=alpha;cx.fillStyle=pc[i];cx.beginPath();cx.arc(px[i],py[i],sz,0,6.283);cx.fill();if(alpha>0.5){cx.globalAlpha=alpha*0.6;cx.fillStyle='#fff';cx.beginPath();cx.arc(px[i],py[i],sz*0.4,0,6.283);cx.fill()}if(j!==i){px[j]=px[i];py[j]=py[i];pvx[j]=pvx[i];pvy[j]=pvy[i];pl[j]=pl[i];pml[j]=pml[i];ps[j]=ps[i];pc[j]=pc[i];pt[j]=pt[i]}j++}}pn=j;cx.globalAlpha=1;cx.globalCompositeOperation='source-over';requestAnimationFrame(loop)}requestAnimationFrame(loop);
cv.addEventListener('click',function(e){addRocket(e.clientX,e.clientY)});cv.addEventListener('touchstart',function(e){e.preventDefault();addRocket(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
function autoShow(){for(var i=0;i<8;i++){setTimeout(function(){addRocket(rand(W*0.15,W*0.85),rand(H*0.1,H*0.5))},i*380+rand(0,150))}}function finale(){var k=0;var iv=setInterval(function(){for(var i=0;i<3;i++)addRocket(rand(W*0.1,W*0.9),rand(H*0.1,H*0.45));k++;if(k>6)clearInterval(iv)},180)};
</script></body></html>
